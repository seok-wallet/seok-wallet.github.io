<style>

.k{font-size:12px;color:var(--sub)}
.v{font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.3px}

.d{font-size:12px;margin-top:4px;color:var(--sub)}
.up{color:var(--exp)}.down{color:var(--inc)}

.chk.al.on{background:var(--allowbg);border-color:#f7c999}
.chk.du input{accent-color:var(--pri2)}

.dbox{border:1px solid #c5d5ea;border-radius:12px;padding:10px;margin:-4px 0 12px;background:#f8fbff}
.drow{display:grid;grid-template-columns:1.1fr 1fr 1fr 34px;gap:6px;margin-bottom:6px;align-items:center}
.drow .inp{padding:8px 8px;font-size:13px}
.drow .x{border:0;background:var(--line);height:34px;border-radius:9px}
.dhead{display:grid;grid-template-columns:1.1fr 1fr 1fr 34px;gap:6px;font-size:11px;color:var(--sub);font-weight:700;margin-bottom:4px}
.dsum{font-size:12.5px;margin-top:8px;line-height:1.7;border-top:1px dashed #c5d5ea;padding-top:8px}
.dsum b{float:right}
.btn{border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px;width:100%}
.btn.p{background:var(--pri);color:#fff}
.btn.g{background:var(--line);color:var(--ink)}
.btn.d{background:var(--expbg);color:var(--exp)}
.btn.s{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btns{display:flex;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(20,28,40,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.lock{min-height:100vh;background:linear-gradient(180deg,#1f3a5f 0%,#2f5d8f 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:9vh 24px 24px}
.lk-logo{font-size:40px;margin-bottom:6px}
.lock h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.5px}
.lk-sub{font-size:13px;opacity:.75;margin-top:6px}
.lk-dots{display:flex;gap:14px;margin:28px 0 8px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.lk-dots i.on{background:#fff;border-color:#fff}
.lk-dots.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lk-msg{height:20px;font-size:13px;color:#ffd2a6}
.lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 24px;margin-top:22px}
.lk-pad button{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:28px;font-weight:500}
.lk-pad button:active{background:rgba(255,255,255,.3)}
.lk-pad button.lk-s{background:transparent;font-size:14px;font-weight:700}
.lk-foot{margin-top:auto;padding-top:30px;font-size:11px;opacity:.5}
.foot{text-align:center;color:var(--mute);font-size:11px;padding:14px 0 4px}
.sett h4{margin:16px 0 8px;font-size:13px;color:var(--pri)}
.scat{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.scat .row .inp{padding:7px 9px}
.hint{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.5}
.pend{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pend:last-child{border:0}
</style>
</head>
<body>
<div id="root"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 설정 (Supabase 연결 시 여기만 채우기) ============ */
const CONFIG = {
  SUPABASE_URL: 'https://rzzfmhxvdunkbgaqkpmr.supabase.co',
  SUPABASE_KEY: 'sb_publishable_n9ctzEGW2sigsNCwKy0mpw_IfTHjDye',
  LOGIN_EMAIL: 'seok5270@cauhs.or.kr'   // 관리자(나) 계정 이메일 (비밀번호 = 6자리 PIN)
  // 다른 사용자는 PIN으로 만든 전용 이메일(설정 > 사용자 추가에서 확인)로 로그인돼요
};
const DEMO_PIN = '000000';
// Supabase 연결 전 임시 확인용 (PIN 원문은 코드에 넣지 않음)
const LOCAL_PIN_HASH = '27719960a895e38f289edca06b89a28492d9d31f342d1676535d0f33e952d908';
const VERSION = 'v0.2';

/* ============ 기본 분류 (* = 용돈 차감 기본 체크) ============ */
const DEFAULT_SETTINGS = {
  allowance: 100000,
  weekStart: 1, // 1=월요일, 0=일요일
  cats: {
    expense: [
      {name:'식비', icon:'🍚', budget:600000, subs:'식료품,아침,점심,커피/음료,*외식,*혼술,*배달,*간식/잡비'},
      {name:'교통/차량', icon:'🚗', budget:250000, subs:'대중교통,주유,주차/통행료,차량정비,*택시'},
      {name:'문화생활', icon:'🎬', budget:100000, subs:'구독,여행,*영화/공연,*취미,*게임'},
      {name:'패션/미용', icon:'👕', budget:100000, subs:'미용실,화장품,*의류,*잡화'},
      {name:'생활용품', icon:'🧴', budget:100000, subs:'생필품,가전/가구,*기타'},
      {name:'대출금', icon:'🏦', budget:700000, subs:'원금,이자'},
      {name:'고정지출', icon:'📌', budget:300000, subs:'통신비,관리비,보험료,구독료,공과금'},
      {name:'건강', icon:'💊', budget:100000, subs:'병원,약국,운동'},
      {name:'경조사/회비', icon:'🎁', budget:150000, subs:'경조사,모임회비,선물'}
    ],
    income: [
      {name:'월급', icon:'💰', subs:'월급,상여'},
      {name:'잡이익', icon:'🪙', subs:'더치페이 초과,중고판매,환급,기타'},
      {name:'기타수입', icon:'➕', subs:'기타'}
    ]
  }
};
const COLORS = ['#2f5d8f','#16935f','#8e5cc7','#d4537e','#3aa3b8','#c2872d','#5a6b7d','#d9483f','#7a9a2f','#9c6b4a'];

/* ============ 유틸 ============ */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n||0).toLocaleString('ko-KR');
const won = n => fmt(n) + '원';
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const ym = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id'+Date.now()+Math.random().toString(16).slice(2));
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const compact = n => { n = Math.round(n); if (Math.abs(n) >= 10000) { const m = n/10000; return (Math.abs(m) >= 100 ? Math.round(m) : Math.round(m*10)/10) + '만'; } return fmt(n); };
const WD = ['일','월','화','수','목','금','토'];
const num = v => Number(String(v??'').replace(/[^\d.-]/g,'')) || 0;

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1800); }

/* ============ 상태 ============ */
let S = { settings: null, txs: [], view: 'home', mon: null, wk: null, cal: null, sel: null, bcat: null, user: null };

function parseSubs(str){ return String(str||'').split(',').map(x=>x.trim()).filter(Boolean).map(x => ({ name: x.replace(/^\*/,''), allow: x.startsWith('*') })); }
function cats(type){ return S.settings.cats[type]; }
function catOf(type, name){ return cats(type).find(c => c.name === name) || {name, icon:'•', subs:''}; }
function catColor(name){ const i = cats('expense').findIndex(c => c.name === name); return COLORS[(i<0?9:i) % COLORS.length]; }
function catIcon(type, name){ return catOf(type, name).icon || '•'; }

/* ============ 계산 ============ */
// 더치페이: 받은 돈 중 예정금액까지는 지출 차감, 초과분은 잡이익
function calc(t){
  let recv = 0, extra = 0, pending = 0;
  (t.dutch || []).forEach(p => {
    const sh = num(p.share), rc = num(p.recv);
    recv += Math.min(rc, sh); extra += Math.max(0, rc - sh); pending += Math.max(0, sh - rc);
  });
  return { net: t.amount - recv, recv, extra, pending };
}
const netOf = t => t.type === 'expense' ? calc(t).net : 0;
function weekStartOf(d){ const ws = S.settings.weekStart; const diff = (d.getDay() - ws + 7) % 7; return addD(d, -diff); }
function inRange(t, a, b){ return t.date >= a && t.date <= b; } // 문자열 비교
function sumExp(list){ return list.filter(t => t.type === 'expense').reduce((s,t) => s + calc(t).net, 0); }
function sumInc(list){ return list.reduce((s,t) => s + (t.type === 'income' ? t.amount : calc(t).extra), 0); }
function sumAllow(list){ return list.filter(t => t.type === 'expense' && t.allow).reduce((s,t) => s + calc(t).net, 0); }
function txIn(a, b){ return S.txs.filter(t => inRange(t, a, b)); }
function monthRange(d){ return [ds(new Date(d.getFullYear(), d.getMonth(), 1)), ds(new Date(d.getFullYear(), d.getMonth()+1, 0))]; }
function weekRange(d){ const s = weekStartOf(d); return [ds(s), ds(addD(s,6))]; }
function allowUsedWeek(dateStr, excludeId){
  const [a,b] = weekRange(pd(dateStr));
  return S.txs.filter(t => t.id !== excludeId && t.type === 'expense' && t.allow && inRange(t,a,b)).reduce((s,t)=>s+calc(t).net,0);
}

/* ============ 저장소 (체험: localStorage / 실사용: Supabase) ============ */
/* 모드: demo(000000 구경용, 저장 안 함) / local(Supabase 연결 전 임시, 이 기기에만 저장) / supabase(실사용) */
const LS_KEY = 'seokwallet_local_v1';
const CONNECTED = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY && CONFIG.LOGIN_EMAIL);
async function sha256(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join(''); }
// 사용자별 로그인 이메일 (PIN에서 만들어짐, 실제 메일함 아님)
async function pinEmail(pin){ return 'u' + (await sha256('seokwallet:' + pin)).slice(0, 20) + '@seok-wallet.github.io'; }
const isAdmin = () => Store.mode === 'supabase' && S.user && S.user.email === CONFIG.LOGIN_EMAIL;
const userName = () => (S.settings && S.settings.name) || (Store.mode === 'demo' ? '구경' : '');
const Store = {
  mode: null,
  sb: null,
  async loadLib(){
    if (window.supabase) return;
    await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = ok; s.onerror = () => no(new Error('Supabase 라이브러리를 불러오지 못했습니다')); document.head.appendChild(s); });
  },
  // PIN 확인 → 맞으면 데이터 불러오기. 틀리면 false
  async unlock(pin){
    if (pin === DEMO_PIN) {
      this.mode = 'demo'; S.settings = clone(DEFAULT_SETTINGS); S.txs = sampleData(); return true;
    }
    if (CONNECTED) {
      await this.loadLib();
      if (!this.sb) this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, { auth: { persistSession: false } });
      // 1) 관리자 이메일로 시도 → 2) PIN 전용 이메일(다른 사용자)로 시도
      let { data, error } = await this.sb.auth.signInWithPassword({ email: CONFIG.LOGIN_EMAIL, password: pin });
      if (error && (error.code === 'invalid_credentials' || /invalid login credentials/i.test(error.message)))
        ({ data, error } = await this.sb.auth.signInWithPassword({ email: await pinEmail(pin), password: pin }));
      if (error) {
        if (error.code === 'invalid_credentials' || /invalid login credentials/i.test(error.message)) return false;
        if (/email not confirmed/i.test(error.message)) throw new Error('계정 이메일 인증이 안 됐어요 (Supabase Users에서 Auto Confirm 필요)');
        if (/invalid api key|no api key/i.test(error.message)) throw new Error('Supabase 키가 맞지 않아요');
        throw error;
      }
      this.mode = 'supabase'; S.user = data.user; await this.loadAll(); return true;
    }
    if (await sha256(pin) !== LOCAL_PIN_HASH) return false;
    this.mode = 'local';
    let d = null; try { d = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}
    S.settings = mergeSettings(d && d.settings); S.txs = (d && d.txs) || []; return true;
  },
  async logout(){ if (this.mode === 'supabase' && this.sb) await this.sb.auth.signOut(); location.reload(); },
  async loadAll(){
    const rows = []; let from = 0;
    while (true) {
      const { data, error } = await this.sb.from('wallet_tx').select('*').order('date').range(from, from + 999);
      if (error) throw error; rows.push(...data); if (data.length < 1000) break; from += 1000;
    }
    S.txs = rows.map(r => ({ id:r.id, date:r.date, type:r.type, cat:r.cat, sub:r.sub, amount:Number(r.amount), allow:!!r.allow, memo:r.memo||'', dutch:r.dutch||null, created_at:r.created_at }));
    const { data: st } = await this.sb.from('wallet_settings').select('data').maybeSingle();
    S.settings = mergeSettings(st && st.data);
  },
  persist(){ if (this.mode === 'local') { try { localStorage.setItem(LS_KEY, JSON.stringify({ settings: S.settings, txs: S.txs })); } catch(e){} } },
  async save(t){
    if (this.mode === 'supabase') {
      const row = { id:t.id, date:t.date, type:t.type, cat:t.cat, sub:t.sub, amount:t.amount, allow:t.allow, memo:t.memo, dutch:t.dutch, updated_at:new Date().toISOString() };
      const { error } = await this.sb.from('wallet_tx').upsert(row); if (error) throw error;
    }
    const i = S.txs.findIndex(x => x.id === t.id); if (i >= 0) S.txs[i] = t; else S.txs.push(t);
    this.persist();
  },
  async del(id){
    if (this.mode === 'supabase') { const { error } = await this.sb.from('wallet_tx').delete().eq('id', id); if (error) throw error; }
    S.txs = S.txs.filter(t => t.id !== id); this.persist();
  },
  async saveSettings(){
    if (this.mode === 'supabase') { const { error } = await this.sb.from('wallet_settings').upsert({ user_id: S.user.id, data: S.settings, updated_at: new Date().toISOString() }); if (error) throw error; }
    this.persist();
  }
};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mergeSettings(s){ const d = clone(DEFAULT_SETTINGS); if (!s) return d; return Object.assign(d, s, { cats: s.cats || d.cats }); }

/* ============ 체험용 예시 데이터 ============ */
function sampleData(){
  let seed = 11; const r = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
  const out = [], T = today(), start = new Date(T.getFullYear(), T.getMonth() - 11, 1);
  const pick = a => a[Math.floor(r() * a.length)];
  const fun = [['식비','외식','동네 맛집'],['식비','혼술','편의점 맥주'],['식비','배달','치킨'],['식비','간식/잡비','편의점'],['문화생활','영화/공연','영화'],['교통/차량','택시','야근 택시'],['패션/미용','의류','티셔츠'],['문화생활','취미','캠핑용품']];
  for (let d = new Date(start); d <= T; d = addD(d, 1)) {
    const s = ds(d), dow = d.getDay(), day = d.getDate(), recent = (T - d) / 864e5;
    const add = (type, cat, sub, amount, allow = false, memo = '', dutch = null) => out.push({ id: uid(), date: s, type, cat, sub, amount: Math.round(amount / 100) * 100, allow, memo, dutch });
    if (day === 25) add('income','월급','월급',3200000,false,'급여');
    if (day === 5) add('expense','고정지출','관리비',140000 + r()*40000);
    if (day === 10) add('expense','고정지출','통신비',65000);
    if (day === 12) add('expense','고정지출','보험료',98000);
    if (day === 1) add('expense','고정지출','구독료',17000,false,'OTT');
    if (day === 15) { add('expense','대출금','원금',500000); add('expense','대출금','이자',170000); }
    if (dow >= 1 && dow <= 5) {
      add('expense','식비','점심',8000 + r()*4000);
      if (r() < .7) add('expense','식비','커피/음료',3000 + r()*2500);
      if (r() < .15) add('expense','교통/차량','대중교통',2800);
    }
    if (dow === 6) add('expense','식비','식료품',35000 + r()*45000,false,'마트');
    if (dow === 3 && r() < .55) add('expense','교통/차량','주유',55000 + r()*25000);
    if (r() < .27) { const f = pick(fun); add('expense', f[0], f[1], 7000 + r()*38000, true, f[2]); }
    if (r() < .05) add('expense','생활용품','생필품',9000 + r()*30000);
    if (r() < .025) add('expense','건강','병원',8000 + r()*25000);
    if (r() < .02) add('expense','경조사/회비', pick(['경조사','모임회비']), pick([30000,50000,100000]));
    if (r() < .012) add('income','잡이익','중고판매',20000 + r()*60000);
    if (r() < .035) {
      const n = 2 + Math.floor(r()*2), total = (25000 + Math.floor(r()*15000)) * (n + 1), share = Math.round(total / (n + 1) / 100) * 100;
      const names = ['민수','지훈','현우','수진'];
      const dutch = Array.from({length:n}, (_, i) => ({ name: names[i], share, recv: recent < 12 && i === 0 ? 0 : share }));
      add('expense','식비','외식',total,true,'친구들 저녁 (더치)',dutch);
    }
  }
  // 초과 입금 → 잡이익 예시
  const ex = out.filter(t => t.dutch).slice(-4)[0];
  if (ex) ex.dutch[ex.dutch.length - 1].recv = ex.dutch[ex.dutch.length - 1].share + 5000;
  return out;
}

/* ============ 공통 화면 조각 ============ */
function itemHTML(t){
  const c = calc(t), isE = t.type === 'expense';
  const color = isE ? catColor(t.cat) : '#16935f';
  const tags = [];
  if (isE && t.allow) tags.push('<span class="tag al">용돈</span>');
  if (t.dutch && t.dutch.length) {
    tags.push('<span class="tag du">더치 ' + (t.dutch.length + 1) + '명</span>');
    if (c.pending > 0) tags.push('<span class="tag pd">받을 돈 ' + fmt(c.pending) + '</span>');
    if (c.extra > 0) tags.push('<span class="tag ex">잡이익 +' + fmt(c.extra) + '</span>');
  }
  const amt = isE ? '-' + fmt(c.net) : '+' + fmt(t.amount);
  const orig = isE && c.recv > 0 ? '<small>' + fmt(t.amount) + '</small>' : '';
  return `<div class="it" data-id="${t.id}"><div class="ic" style="background:${color}1a">${catIcon(t.type, t.cat)}</div>
    <div style="min-width:0"><div class="t1">${esc(t.sub || t.cat)}${t.memo ? ' <span style="color:var(--sub);font-weight:500">· ' + esc(t.memo) + '</span>' : ''}</div>
    <div class="t2">${esc(t.cat)}${tags.join('')}</div></div>
    <div class="am ${isE ? 'exp' : 'inc'}">${amt}${orig}</div></div>`;
}
function listByDate(list){
  if (!list.length) return '<div class="empty">내역이 없어요</div>';
  const g = {}; list.forEach(t => (g[t.date] = g[t.date] || []).push(t));
  return '<div class="list">' + Object.keys(g).sort().reverse().map(k => {
    const d = pd(k), e = sumExp(g[k]), i = sumInc(g[k]);
    return `<div class="dh">${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})<span>${i ? '<b class="inc">+' + fmt(i) + '</b> ' : ''}${e ? '-' + fmt(e) : ''}</span></div>` +
      g[k].sort((a,b) => (b.created_at||'').localeCompare(a.created_at||'')).map(itemHTML).join('');
  }).join('') + '</div>';
}
function catBars(list, withBudget){
  const ex = list.filter(t => t.type === 'expense'), tot = sumExp(ex);
  const rows = cats('expense').map(c => ({ c, v: sumExp(ex.filter(t => t.cat === c.name)) }));
  // 분류에 없는 항목도 표시
  const known = new Set(cats('expense').map(c => c.name));
  const other = sumExp(ex.filter(t => !known.has(t.cat))); if (other) rows.push({ c: {name:'기타', icon:'•'}, v: other });
  const shown = rows.filter(x => x.v > 0 || withBudget).sort((a,b) => b.v - a.v);
  if (!shown.length) return '<div class="empty">지출이 없어요</div>';
  const max = Math.max(...shown.map(x => x.v), 1);
  return shown.map(x => {
    const col = catColor(x.c.name), b = num(x.c.budget);
    const w = withBudget && b ? Math.min(100, x.v / b * 100) : x.v / max * 100;
    const over = withBudget && b && x.v > b;
    const sub = withBudget && b ? `<div class="pct ${over ? 'up' : ''}">${over ? '초과 ' + fmt(x.v - b) : '남음 ' + fmt(b - x.v)}</div>` : `<div class="pct">${tot ? Math.round(x.v / tot * 100) : 0}%</div>`;
    return `<div class="catrow" data-cat="${esc(x.c.name)}"><div class="ic" style="background:${col}1a">${x.c.icon || '•'}</div><div class="nm">${esc(x.c.name)}</div>
      <div class="bw"><div class="hb"><i style="width:${w}%;background:${over ? 'var(--exp)' : col}"></i></div></div>
      <div><div class="amt">${fmt(x.v)}</div>${sub}</div></div>`;
  }).join('');
}
function allowCard(dateObj, compactMode){
  const [a,b] = weekRange(dateObj), used = sumAllow(txIn(a,b)), bud = S.settings.allowance, left = bud - used, over = left < 0;
  const T = today(), isCur = ds(T) >= a && ds(T) <= b;
  const daysLeft = isCur ? (pd(b) - T) / 864e5 + 1 : 0;
  const perDay = isCur && left > 0 ? Math.floor(left / daysLeft / 100) * 100 : 0;
  return `<div class="card allowcard"><h3>💸 ${isCur ? '이번 주' : ''} 용돈 <span class="r">${pd(a).getMonth()+1}/${pd(a).getDate()} ~ ${pd(b).getMonth()+1}/${pd(b).getDate()}</span></h3>
    <div class="allowtop"><div><div class="k">${over ? '초과' : '남은 용돈'}</div><div class="big ${over ? 'over' : ''}">${fmt(Math.abs(left))}<small style="font-size:14px">원</small></div></div>
    <div style="text-align:right"><div class="k">사용 ${fmt(used)} / ${fmt(bud)}</div>${isCur && !over ? `<div class="d">남은 ${daysLeft}일 · 하루 ${fmt(perDay)}원</div>` : ''}</div></div>
    <div class="bar ${over ? 'over' : ''}"><i style="width:${Math.min(100, used / bud * 100)}%"></i></div></div>`;
}

/* ============ SVG 차트 ============ */
function monthChart(months){
  const W = 340, H = 190, top = 22, bot = 24, ch = H - top - bot, bw = W / months.length;
  const max = Math.max(...months.map(m => Math.max(m.exp, m.inc)), 1);
  const y = v => top + ch - v / max * ch;
  let g = '';
  [0.5, 1].forEach(f => { g += `<line x1="0" x2="${W}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#eef0f3" />`; });
  months.forEach((m, i) => {
    const x = i * bw, h = Math.max(1, m.exp / max * ch), cur = i === months.length - 1;
    const allowH = m.allow / max * ch;
    g += `<g class="mbar" data-m="${m.key}" style="cursor:pointer"><rect x="${x}" y="${top}" width="${bw}" height="${ch}" fill="transparent"/>
      <rect x="${x + bw*0.2}" y="${y(m.exp)}" width="${bw*0.6}" height="${h}" rx="3" fill="${cur ? '#1f3a5f' : '#9fb4cf'}"/>
      <rect x="${x + bw*0.2}" y="${top + ch - allowH}" width="${bw*0.6}" height="${allowH}" rx="2" fill="#ef7d1a" opacity=".9"/>
      <text x="${x + bw/2}" y="${y(m.exp) - 5}" font-size="8.5" text-anchor="middle" fill="#45505e" font-weight="700">${m.exp ? Math.round(m.exp/10000) : ''}</text>
      <text x="${x + bw/2}" y="${H - 8}" font-size="10" text-anchor="middle" fill="${cur ? '#1f3a5f' : '#8a94a1'}" font-weight="${cur ? 800 : 500}">${m.label}</text></g>`;
  });
  // 수입 선: 수입이 있는 달끼리만 연결 (월급 전인 이번 달은 0으로 떨어지지 않게)
  for (let i = 1; i < months.length; i++) if (months[i].inc && months[i-1].inc)
    g += `<line x1="${(i-1) * bw + bw/2}" y1="${y(months[i-1].inc)}" x2="${i * bw + bw/2}" y2="${y(months[i].inc)}" stroke="#16935f" stroke-width="1.6" stroke-dasharray="3 3"/>`;
  months.forEach((m, i) => { if (m.inc) g += `<circle cx="${i * bw + bw/2}" cy="${y(m.inc)}" r="2.6" fill="#16935f"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function weeksChart(weeks, bud){
  const W = 340, H = 150, top = 16, bot = 22, ch = H - top - bot, bw = W / weeks.length;
  const max = Math.max(bud * 1.3, ...weeks.map(w => w.v), 1), y = v => top + ch - v / max * ch;
  let g = `<line x1="0" x2="${W}" y1="${y(bud)}" y2="${y(bud)}" stroke="#ef7d1a" stroke-dasharray="4 3"/><text x="${W-2}" y="${y(bud)-4}" font-size="9" text-anchor="end" fill="#ef7d1a" font-weight="700">예산 ${compact(bud)}</text>`;
  weeks.forEach((w, i) => {
    const x = i * bw, over = w.v > bud;
    g += `<rect x="${x + bw*.22}" y="${y(w.v)}" width="${bw*.56}" height="${Math.max(1, w.v / max * ch)}" rx="3" fill="${over ? '#d9483f' : (i === weeks.length-1 ? '#ef7d1a' : '#f6c08f')}"/>
      <text x="${x + bw/2}" y="${H-7}" font-size="9" text-anchor="middle" fill="#8a94a1">${w.label}</text>`;
    if (over) g += `<text x="${x + bw/2}" y="${y(w.v)-4}" font-size="8.5" text-anchor="middle" fill="#d9483f" font-weight="700">${compact(w.v)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}

/* ============ 화면: 대시보드 ============ */

  }

  <div class="grid2">
    <div class="card"><div class="k">이번 달 지출</div><div class="v">${fmt(cur.exp)}<small>원</small></div>
      <div class="d">지난달 같은 기간 대비 <b class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))}</b></div></div>
    <div class="card"><div class="k">이번 달 수입</div><div class="v inc">${fmt(cur.inc)}<small>원</small></div>
      <div class="d">수지 <b class="${cur.inc - cur.exp >= 0 ? 'down' : 'up'}">${cur.inc - cur.exp >= 0 ? '+' : ''}${fmt(cur.inc - cur.exp)}</b></div></div>
  </div>
  <div class="card"><h3>📊 최근 12개월 <span class="r">막대 위 숫자: 만원</span></h3>
    <div class="row" style="gap:14px;margin-bottom:6px;flex-wrap:wrap">
      <div><div class="k">총 지출</div><div style="font-weight:800">${fmt(totE)}</div></div>
      <div><div class="k">월평균</div><div style="font-weight:800">${fmt(totE/12)}</div></div>
      <div><div class="k">총 수입</div><div style="font-weight:800" class="inc">${fmt(totI)}</div></div>
      <div><div class="k">용돈 비중</div><div style="font-weight:800;color:var(--allow)">${totE ? Math.round(totA/totE*100) : 0}%</div></div>
    </div>
    ${monthChart(months)}
    <div class="legend"><span><i style="background:#9fb4cf"></i>지출</span><span><i style="background:#ef7d1a"></i>그중 용돈</span><span><i style="background:#16935f;border-radius:50%"></i>수입</span><span style="margin-left:auto">막대를 누르면 월간으로</span></div>
  </div>
  <div class="card"><h3>💸 주별 용돈 사용 (최근 12주) <span class="r">초과 ${overW}주</span></h3>${weeksChart(weeks, S.settings.allowance)}</div>
  <div class="card"><h3>🗂 분류별 지출 (12개월) <span class="r">월평균</span></h3>${catBarsAvg(yl)}</div>
  ${pend.length ? `<div class="card"><h3>🤝 더치페이 받을 돈 <span class="r">${pend.length}건 · ${won(pendSum)}</span></h3>${pend.slice(0,8).map(t => {
    const ppl = t.dutch.filter(p => num(p.recv) < num(p.share)).map(p => esc(p.name) + ' ' + fmt(num(p.share) - num(p.recv))).join(', ');
    return `<div class="pend"><div style="flex:1"><b>${pd(t.date).getMonth()+1}/${pd(t.date).getDate()}</b> ${esc(t.memo || t.sub)}<div class="hint" style="margin:0">${ppl}</div></div><button class="btn g s" data-edit="${t.id}">입금 처리</button></div>`;
  }).join('')}</div>` : ''}
  `;
}
function catBarsAvg(list){
  const html = catBars(list, false);
  return html.replace(/<div class="amt">([\d,]+)<\/div>/g, (m, v) => `<div class="amt">${fmt(num(v)/12)}</div>`);
}

/* ============ 화면: 월간 ============ */
function viewMonth(){
  const d = S.mon, [a,b] = monthRange(d), l = txIn(a,b), e = sumExp(l), i = sumInc(l), al = sumAllow(l);
  return `<div class="nav"><button data-nav="mon:-1">◀</button><b>${d.getFullYear()}년 ${d.getMonth()+1}월</b><button data-nav="mon:1">▶</button></div>
  <div class="grid2">
    <div class="card"><div class="k">지출</div><div class="v">${fmt(e)}<small>원</small></div><div class="d">용돈 사용 <b style="color:var(--allow)">${fmt(al)}</b></div></div>
    <div class="card"><div class="k">수입</div><div class="v inc">${fmt(i)}<small>원</small></div><div class="d">수지 <b class="${i-e >= 0 ? 'down' : 'up'}">${i-e >= 0 ? '+' : ''}${fmt(i-e)}</b></div></div>
  </div>
  <div class="card"><h3>🗂 분류별 <span class="r">월 예산 대비</span></h3>${catBars(l, true)}</div>
  ${listByDate(l)}`;
}

/* ============ 화면: 주간 ============ */
function viewWeek(){
  const s = weekStartOf(S.wk), [a,b] = [ds(s), ds(addD(s,6))], l = txIn(a,b);
  const days = Array.from({length:7}, (_, i) => { const d = addD(s, i), k = ds(d), dl = l.filter(t => t.date === k); return { d, e: sumExp(dl), al: sumAllow(dl) }; });
  const max = Math.max(...days.map(x => x.e), 1);
  // 최근 8주 용돈 표
  const rows = []; for (let i = 0; i < 8; i++) { const ws = addD(s, -7*i), wa = ds(ws), wb = ds(addD(ws,6)), u = sumAllow(txIn(wa,wb)); rows.push(`<tr><td>${ws.getMonth()+1}/${ws.getDate()} ~ ${addD(ws,6).getMonth()+1}/${addD(ws,6).getDate()}</td><td style="color:${u > S.settings.allowance ? 'var(--exp)' : 'var(--ink)'}">${fmt(u)} <span style="color:var(--mute);font-weight:500">/ ${compact(S.settings.allowance)}</span></td></tr>`); }
  return `<div class="nav"><button data-nav="wk:-1">◀</button><b>${s.getMonth()+1}/${s.getDate()} ~ ${addD(s,6).getMonth()+1}/${addD(s,6).getDate()}</b><button data-nav="wk:1">▶</button></div>
  ${allowCard(s)}
  <div class="card"><h3>📅 요일별 지출 <span class="r">합계 ${won(sumExp(l))}</span></h3>
    <div class="wk">${days.map(x => `<div class="b"><em>${x.e ? compact(x.e) : ''}</em><i style="height:${x.e / max * 85}%"></i><span class="${x.d.getDay()===0?'sun':x.d.getDay()===6?'sat':''}">${WD[x.d.getDay()]}</span></div>`).join('')}</div>
  </div>
  ${listByDate(l)}
  <div class="card" style="margin-top:12px"><h3>💸 최근 8주 용돈</h3><table class="wtable">${rows.join('')}</table></div>`;
}

/* ============ 화면: 일간 (달력) ============ */
function viewDay(){
  const m = S.cal, first = new Date(m.getFullYear(), m.getMonth(), 1), gs = weekStartOf(first);
  const last = new Date(m.getFullYear(), m.getMonth()+1, 0);
  const cells = []; const T = ds(today());
  for (let d = gs; d <= last || cells.length % 7; d = addD(d, 1)) cells.push(d);
  const head = Array.from({length:7}, (_, i) => (S.settings.weekStart + i) % 7);
  const sel = S.sel, l = S.txs.filter(t => t.date === sel);
  return `<div class="nav"><button data-nav="cal:-1">◀</button><b>${m.getFullYear()}년 ${m.getMonth()+1}월</b><button data-nav="cal:1">▶</button></div>
  <div class="card" style="padding:10px"><div class="cal">${head.map(w => `<div class="w ${w===0?'sun':w===6?'sat':''}">${WD[w]}</div>`).join('')}
  ${cells.map(d => { const k = ds(d), dl = S.txs.filter(t => t.date === k), e = sumExp(dl), inc = sumInc(dl), al = sumAllow(dl);
    return `<div class="c ${d.getMonth() !== m.getMonth() ? 'o' : ''} ${k === T ? 't' : ''} ${k === sel ? 's' : ''}" data-day="${k}">${al ? '<span class="dot"></span>' : ''}<span class="n ${d.getDay()===0?'sun':d.getDay()===6?'sat':''}">${d.getDate()}</span>${e ? `<div class="e">-${compact(e)}</div>` : ''}${inc ? `<div class="i">+${compact(inc)}</div>` : ''}</div>`; }).join('')}
  </div><div class="legend"><span><i style="background:var(--allow);border-radius:50%"></i>용돈 사용한 날</span></div></div>
  <div class="card" style="background:transparent;box-shadow:none;padding:0"><h3>${pd(sel).getMonth()+1}월 ${pd(sel).getDate()}일 (${WD[pd(sel).getDay()]}) <span class="r">지출 ${won(sumExp(l))}</span></h3>${l.length ? l.map(itemHTML).join('') : '<div class="empty">내역이 없어요</div>'}</div>`;
}

/* ============ 화면: 예산별 ============ */
function viewBudget(){
  const d = S.mon, [a,b] = monthRange(d), l = txIn(a,b);
  if (S.bcat) {
    const c = catOf('expense', S.bcat), cl = l.filter(t => t.type === 'expense' && t.cat === S.bcat), tot = sumExp(cl);
    const subs = {}; cl.forEach(t => subs[t.sub || '기타'] = (subs[t.sub || '기타'] || 0) + calc(t).net);
    const max = Math.max(...Object.values(subs), 1);
    return `<div class="nav"><button data-bback="1">◀</button><b>${c.icon || ''} ${esc(S.bcat)} · ${d.getMonth()+1}월</b><span style="width:40px"></span></div>
    <div class="card"><div class="k">사용 / 예산</div><div class="v">${fmt(tot)} <small>/ ${fmt(c.budget)}원</small></div>
      <div class="bar gray ${c.budget && tot > c.budget ? 'over' : ''}"><i style="width:${c.budget ? Math.min(100, tot / c.budget * 100) : 0}%"></i></div></div>
    <div class="card"><h3>세부항목</h3>${Object.entries(subs).sort((x,y) => y[1]-x[1]).map(([k,v]) => `<div class="catrow"><div class="nm">${esc(k)}</div><div class="bw"><div class="hb"><i style="width:${v/max*100}%;background:${catColor(S.bcat)}"></i></div></div><div class="amt">${fmt(v)}</div></div>`).join('') || '<div class="empty">지출이 없어요</div>'}</div>
    ${listByDate(cl)}`;
  }
  const ex = l.filter(t => t.type === 'expense'), totB = cats('expense').reduce((s,c) => s + num(c.budget), 0), tot = sumExp(ex);
  // 이달의 주별 용돈
  const wrows = []; let ws = weekStartOf(pd(a));
  while (ds(ws) <= b) { const wa = ds(ws), wb = ds(addD(ws,6)), u = sumAllow(txIn(wa,wb)); wrows.push(`<tr><td>${ws.getMonth()+1}/${ws.getDate()} 주</td><td style="color:${u > S.settings.allowance ? 'var(--exp)' : 'var(--ink)'}">${fmt(u)} <span style="color:var(--mute);font-weight:500">/ ${compact(S.settings.allowance)}</span></td></tr>`); ws = addD(ws, 7); }
  return `<div class="nav"><button data-nav="mon:-1">◀</button><b>${d.getFullYear()}년 ${d.getMonth()+1}월 예산</b><button data-nav="mon:1">▶</button></div>
  ${allowCard(ds(today()) >= a && ds(today()) <= b ? today() : pd(b))}
  <div class="card"><h3>💸 이달 주별 용돈</h3><table class="wtable">${wrows.join('')}</table></div>
  <div class="card"><h3>📋 분류별 월 예산 <span class="r">${fmt(tot)} / ${fmt(totB)}</span></h3>
    <div class="bar gray ${tot > totB ? 'over' : ''}" style="margin:0 0 10px"><i style="width:${totB ? Math.min(100, tot/totB*100) : 0}%"></i></div>
    ${catBars(l, true)}<div class="hint">분류를 누르면 세부항목을 볼 수 있어요 · 예산은 ⚙ 설정에서 바꿔요</div></div>`;
}

/* ============ 렌더 ============ */
const TABS = [['home','🏠','대시보드'],['month','🗓','월간'],['week','📆','주간'],['day','📅','일간'],['budget','🎯','예산별']];
function render(){
  const body = { home: viewHome, month: viewMonth, week: viewWeek, day: viewDay, budget: viewBudget }[S.view]();
  $('#root').innerHTML = `<div class="app">
    <header><h1>SEOK WALLET<small>${userName() ? esc(userName()) + '님' : '지출관리'}</small></h1>${Store.mode !== 'demo' ? '<button class="hbtn" id="bkBtn" title="백업">⬇</button>' : ''}<button class="hbtn" id="setBtn" title="설정">⚙</button><button class="hbtn" id="lockBtn" title="잠금">🔒</button></header>
    ${Store.mode === 'demo' ? '<div class="demo">👀 구경 모드 · 예시 데이터예요. 입력해 봐도 저장되지 않아요</div>' : ''}
    ${Store.mode === 'local' ? '<div class="demo">⚠ 서버 연결 전 · 이 기기에만 임시 저장돼요</div>' : ''}
    <main>${body}<div class="foot">${VERSION} | SEOK WALLET</div></main>
    <button class="fab" id="fab">＋</button>
    <nav class="tabs"><div class="in">${TABS.map(t => `<button data-tab="${t[0]}" class="${S.view === t[0] ? 'on' : ''}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</div></nav></div>`;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tab],[data-nav],[data-id],[data-day],[data-cat],[data-bback],[data-edit],.mbar,#fab,#setBtn,#bkBtn,#lockBtn');
  if (!el || el.closest('#sheet')) return;
  if (el.dataset.tab) { if (S.view === el.dataset.tab && !S.bcat) return; go({ view: el.dataset.tab, bcat: null }); return; }
  if (el.dataset.nav) { const [k, v] = el.dataset.nav.split(':'), n = Number(v);
    if (k === 'mon') S.mon = new Date(S.mon.getFullYear(), S.mon.getMonth() + n, 1);
    if (k === 'wk') S.wk = addD(S.wk, 7 * n);
    if (k === 'cal') { S.cal = new Date(S.cal.getFullYear(), S.cal.getMonth() + n, 1); }
    render(); keep(); return; }
  if (el.dataset.id) return openForm(S.txs.find(t => t.id === el.dataset.id));
  if (el.dataset.edit) return openForm(S.txs.find(t => t.id === el.dataset.edit));
  if (el.dataset.day) { S.sel = el.dataset.day; render(); keep(); return; }
  if (el.dataset.cat && S.view === 'budget') { go({ bcat: el.dataset.cat }); return; }
  if (el.dataset.cat && S.view === 'month') { go({ view: 'budget', bcat: el.dataset.cat }); return; }
  if (el.dataset.bback) { if (history.state && history.state.bcat) history.back(); else { S.bcat = null; render(); keep(); } return; }
  if (el.classList.contains('mbar')) { const [y,m] = el.dataset.m.split('-').map(Number); go({ mon: new Date(y, m-1, 1), view: 'month' }); return; }
  if (el.id === 'fab') return openForm(null);
  if (el.id === 'setBtn') return openSettings();
  if (el.id === 'bkBtn') return openBackup();
  if (el.id === 'lockBtn') return Store.logout();
});

/* ============ 모달 ============ */
function openSheet(html){
  if (!$('#mask').classList.contains('on')) history.pushState(Object.assign(snap(), { modal: 1 }), '', location.hash);
  $('#sheet').innerHTML = html; $('#mask').classList.add('on'); document.body.style.overflow = 'hidden';
}
function hideSheet(){ $('#mask').classList.remove('on'); document.body.style.overflow = ''; }
function closeSheet(){ if (history.state && history.state.modal) history.back(); else hideSheet(); }

/* ============ 뒤로가기: 앱 안에서 직전 화면으로 ============ */
function snap(){ return { view: S.view, bcat: S.bcat, mon: ds(S.mon), wk: ds(S.wk), cal: ds(S.cal), sel: S.sel }; }
function keep(){ history.replaceState(snap(), '', '#' + S.view); }               // 같은 화면 안 이동(월 넘기기 등)
function go(patch){ Object.assign(S, patch); history.pushState(snap(), '', '#' + S.view); render(); scrollTo(0,0); }
window.addEventListener('popstate', e => {
  if ($('#mask').classList.contains('on')) { hideSheet(); return; }            // 입력창이 열려 있으면 닫기만
  const st = e.state; if (!st || !st.view || !S.settings) return;
  Object.assign(S, { view: st.view, bcat: st.bcat || null, mon: pd(st.mon), wk: pd(st.wk), cal: pd(st.cal), sel: st.sel });
  render();
});
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeSheet(); });

/* ============ 입력 폼 ============ */
let F = null;
function openForm(t){
  const dflt = S.view === 'day' && S.sel ? S.sel : ds(today());
  F = t ? clone(t) : { id: uid(), date: dflt, type: 'expense', cat: '', sub: '', amount: 0, allow: false, memo: '', dutch: null, created_at: new Date().toISOString(), _new: true };
  F._dutchOn = !!(F.dutch && F.dutch.length); if (!F.dutch) F.dutch = [];
  F._delArm = false;
  drawForm();
}
function drawForm(){
  const isE = F.type === 'expense', cl = cats(F.type), cur = cl.find(c => c.name === F.cat);
  const subs = cur ? parseSubs(cur.subs) : [];
  openSheet(`<h2>${F._new ? '새 내역' : '내역 수정'}<button id="fx">✕</button></h2>
  <div class="seg" style="margin-bottom:12px"><button data-ft="expense" class="${isE ? 'on' : ''}">지출</button><button data-ft="income" class="${!isE ? 'on' : ''}">수입</button></div>
  <div class="fld"><label>${isE ? '결제 금액 (전체)' : '금액'}</label><input class="inp amtin" id="fAmt" inputmode="numeric" placeholder="0" value="${F.amount ? fmt(F.amount) : ''}"></div>
  <div class="fld"><label>날짜</label><input class="inp" type="date" id="fDate" value="${F.date}"></div>
  <div class="fld"><label>분류</label><div class="chips">${cl.map(c => `<button class="chip ${F.cat === c.name ? 'on' : ''}" data-fc="${esc(c.name)}">${c.icon || ''} ${esc(c.name)}</button>`).join('')}</div></div>
  ${subs.length ? `<div class="fld"><label>세부항목 ${isE ? '<span style="font-weight:500;color:var(--mute)">· <span style="color:var(--allow)">★</span> 용돈 기본 항목</span>' : ''}</label><div class="chips">${subs.map(s => `<button class="chip ${F.sub === s.name ? 'on' : ''}" data-fs="${esc(s.name)}" data-al="${s.allow ? 1 : 0}">${esc(s.name)}${isE && s.allow ? '<span class="st">★</span>' : ''}</button>`).join('')}</div></div>` : ''}
  <div class="fld"><label>메모</label><input class="inp" id="fMemo" placeholder="예: 동기들이랑 저녁" value="${esc(F.memo)}"></div>
  ${isE ? `<label class="chk al ${F.allow ? 'on' : ''}"><input type="checkbox" id="fAllow" ${F.allow ? 'checked' : ''}><div style="flex:1"><div class="t">💸 용돈에서 차감</div><div class="s" id="allowInfo"></div></div></label>
  <label class="chk du ${F._dutchOn ? 'on' : ''}"><input type="checkbox" id="fDutch" ${F._dutchOn ? 'checked' : ''}><div style="flex:1"><div class="t">🤝 더치페이</div><div class="s">받은 만큼 내 지출이 줄어들어요</div></div></label>
  <div id="dutchBox"></div>` : ''}
  <div class="btns">${!F._new ? `<button class="btn d" id="fDel" style="width:38%">${F._delArm ? '한 번 더 누르면 삭제' : '삭제'}</button>` : ''}<button class="btn p" id="fSave">저장</button></div>`);
  bindForm(); if (isE) { drawDutch(); updAllow(); }
}
function readForm(){ F.amount = num($('#fAmt').value); F.date = $('#fDate').value || F.date; F.memo = $('#fMemo').value.trim(); }
function bindForm(){
  $('#fx').onclick = closeSheet;
  $('#fAmt').oninput = e => { const v = num(e.target.value); e.target.value = v ? fmt(v) : ''; F.amount = v; updDutchSum(); updAllow(); };
  $('#fDate').onchange = e => { F.date = e.target.value; updAllow(); };
  document.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { readForm(); F.type = b.dataset.ft; F.cat = ''; F.sub = ''; F.allow = false; drawForm(); });
  document.querySelectorAll('[data-fc]').forEach(b => b.onclick = () => { readForm(); F.cat = b.dataset.fc; F.sub = ''; drawForm(); });
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { readForm(); F.sub = b.dataset.fs; if (F.type === 'expense') F.allow = b.dataset.al === '1'; drawForm(); });
  if ($('#fAllow')) $('#fAllow').onchange = e => { F.allow = e.target.checked; e.target.closest('.chk').classList.toggle('on', F.allow); updAllow(); };
  if ($('#fDutch')) $('#fDutch').onchange = e => { F._dutchOn = e.target.checked; e.target.closest('.chk').classList.toggle('on', F._dutchOn); if (F._dutchOn && !F.dutch.length) F.dutch = [{name:'', share:0, recv:0}]; drawDutch(); updAllow(); };
  $('#fSave').onclick = saveForm;
  if ($('#fDel')) $('#fDel').onclick = async () => { if (!F._delArm) { F._delArm = true; $('#fDel').textContent = '한 번 더 누르면 삭제'; return; } try { await Store.del(F.id); closeSheet(); render(); toast('삭제했어요'); } catch(err) { toast('삭제 실패: ' + err.message); } };
}
function drawDutch(){
  const box = $('#dutchBox'); if (!box) return;
  if (!F._dutchOn) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="dbox"><div class="dhead"><span>이름</span><span>받을 금액</span><span>받은 금액</span><span></span></div>
  ${F.dutch.map((p, i) => `<div class="drow"><input class="inp" data-dn="${i}" placeholder="이름" value="${esc(p.name)}"><input class="inp" data-dsh="${i}" inputmode="numeric" placeholder="0" value="${p.share ? fmt(p.share) : ''}"><input class="inp" data-drc="${i}" inputmode="numeric" placeholder="0" value="${p.recv ? fmt(p.recv) : ''}"><button class="x" data-dx="${i}">✕</button></div>`).join('')}
  <div class="row" style="gap:6px;margin-top:4px"><button class="btn g s" id="dAdd">＋ 사람 추가</button><button class="btn g s" id="dSplit">N빵 (나 포함)</button><button class="btn g s" id="dAll">모두 받음</button></div>
  <div class="dsum" id="dSum"></div></div>`;
  const fmtIn = (e, key, i) => { const v = num(e.target.value); e.target.value = v ? fmt(v) : ''; F.dutch[i][key] = v; updDutchSum(); updAllow(); };
  box.querySelectorAll('[data-dn]').forEach(x => x.oninput = e => F.dutch[x.dataset.dn].name = e.target.value);
  box.querySelectorAll('[data-dsh]').forEach(x => x.oninput = e => fmtIn(e, 'share', x.dataset.dsh));
  box.querySelectorAll('[data-drc]').forEach(x => x.oninput = e => fmtIn(e, 'recv', x.dataset.drc));
  box.querySelectorAll('[data-dx]').forEach(x => x.onclick = () => { F.dutch.splice(Number(x.dataset.dx), 1); if (!F.dutch.length) { F._dutchOn = false; $('#fDutch').checked = false; $('#fDutch').closest('.chk').classList.remove('on'); } drawDutch(); updAllow(); });
  $('#dAdd').onclick = () => { F.dutch.push({name:'', share:0, recv:0}); drawDutch(); };
  $('#dSplit').onclick = () => { readForm(); if (!F.amount) return toast('결제 금액을 먼저 넣어주세요'); const n = F.dutch.length + 1, sh = Math.floor(F.amount / n / 100) * 100; F.dutch.forEach(p => p.share = sh); drawDutch(); updAllow(); };
  $('#dAll').onclick = () => { F.dutch.forEach(p => p.recv = p.share); drawDutch(); updAllow(); };
  updDutchSum();
}
function updDutchSum(){
  const el = $('#dSum'); if (!el) return;
  const c = calc(F), shares = F.dutch.reduce((s,p) => s + num(p.share), 0);
  el.innerHTML = `결제 금액<b>${won(F.amount)}</b><br>받을 금액 합계<b>${won(shares)}</b><br>받은 금액 (지출에서 차감)<b style="color:var(--inc)">-${fmt(c.recv)}원</b><br>` +
    (c.pending ? `아직 못 받은 돈<b style="color:var(--exp)">${won(c.pending)}</b><br>` : '') +
    (c.extra ? `더 받은 돈 → 잡이익<b style="color:var(--inc)">+${won(c.extra)}</b><br>` : '') +
    `<span style="font-weight:800">현재 내 지출</span><b style="font-size:14px">${won(c.net)}</b>` +
    (shares > F.amount ? `<div style="color:var(--exp);clear:both">받을 금액이 결제 금액보다 커요</div>` : '');
}
function updAllow(){
  const el = $('#allowInfo'); if (!el) return;
  const used = allowUsedWeek(F.date, F.id), bud = S.settings.allowance, left = bud - used, me = F._dutchOn ? calc(F).net : F.amount;
  el.innerHTML = F.allow ? `이번 주 남은 ${fmt(left)} → 차감 후 <b style="color:${left - me < 0 ? 'var(--exp)' : 'var(--allow)'}">${fmt(left - me)}원</b>` : `이 주 남은 용돈 ${fmt(left)}원`;
}
async function saveForm(){
  readForm();
  if (!F.amount) return toast('금액을 넣어주세요');
  if (!F.cat) return toast('분류를 골라주세요');
  const t = { id: F.id, date: F.date, type: F.type, cat: F.cat, sub: F.sub, amount: F.amount, allow: F.type === 'expense' && F.allow, memo: F.memo, created_at: F.created_at,
    dutch: F.type === 'expense' && F._dutchOn ? F.dutch.filter(p => p.name || num(p.share) || num(p.recv)).map(p => ({ name: p.name || '이름없음', share: num(p.share), recv: num(p.recv) })) : null };
  if (t.dutch && !t.dutch.length) t.dutch = null;
  try { await Store.save(t); closeSheet(); render(); toast(F._new ? '저장했어요' : '수정했어요'); } catch(err) { toast('저장 실패: ' + err.message); }
}

/* ============ 설정 ============ */
function openSettings(){
  const st = S.settings;
  openSheet(`<div class="sett"><h2>⚙ 설정<button id="sx">✕</button></h2>
  <div class="fld"><label>이름 (화면 위에 표시)</label><input class="inp" id="sName" placeholder="예: 현석" value="${esc(st.name || '')}"></div>
  <h4>💸 용돈</h4>
  <div class="row"><div class="fld" style="flex:1"><label>주간 용돈</label><input class="inp" id="sAllow" inputmode="numeric" value="${fmt(st.allowance)}"></div>
  <div class="fld" style="flex:1"><label>한 주 시작</label><select class="inp" id="sWs"><option value="1" ${st.weekStart === 1 ? 'selected' : ''}>월요일</option><option value="0" ${st.weekStart === 0 ? 'selected' : ''}>일요일</option></select></div></div>
  <h4>🗂 지출 분류 · 월 예산 · 세부항목</h4>
  <div class="hint" style="margin:-4px 0 8px">세부항목은 쉼표로 구분해요. 앞에 <b>*</b>을 붙이면 입력할 때 용돈 차감이 자동 체크돼요. (예: *외식)</div>
  ${st.cats.expense.map((c, i) => `<div class="scat"><div class="row"><input class="inp" style="width:52px;text-align:center" data-se="icon" data-i="${i}" value="${esc(c.icon)}"><input class="inp" style="flex:1" data-se="name" data-i="${i}" value="${esc(c.name)}"><input class="inp" style="width:110px;text-align:right" data-se="budget" data-i="${i}" inputmode="numeric" value="${fmt(c.budget)}"></div>
    <input class="inp" style="margin-top:6px;font-size:13px" data-se="subs" data-i="${i}" value="${esc(c.subs)}"></div>`).join('')}
  <button class="btn g s" id="sAddCat">＋ 분류 추가</button>
  <h4>💰 수입 분류</h4>
  ${st.cats.income.map((c, i) => `<div class="scat"><div class="row"><input class="inp" style="width:52px;text-align:center" data-si="icon" data-i="${i}" value="${esc(c.icon)}"><input class="inp" style="flex:1" data-si="name" data-i="${i}" value="${esc(c.name)}"></div>
    <input class="inp" style="margin-top:6px;font-size:13px" data-si="subs" data-i="${i}" value="${esc(c.subs)}"></div>`).join('')}
  <div class="btns" style="margin-top:14px"><button class="btn p" id="sSave">설정 저장</button></div>
  <h4>계정</h4>
  ${Store.mode === 'demo' ? '<div class="hint">구경 모드라 설정을 바꿔도 새로고침하면 처음으로 돌아가요.</div>' : Store.mode === 'supabase' ? `<div class="hint">${esc(S.user && S.user.email)}</div>` : '<div class="hint">서버 연결 전이라 이 기기에만 저장되고 있어요.</div>'}
  <button class="btn g" id="sOut" style="margin-top:6px">🔒 잠그기</button>
  ${isAdmin() ? `<h4>👥 사용자 추가 (관리자)</h4>
  <div class="hint" style="margin:-4px 0 8px">새 사용자에게 줄 숫자 6자리를 넣으면, Supabase에 등록할 로그인 이메일이 만들어져요. 각자 자기 내역만 보여요.</div>
  <div class="row"><input class="inp" id="nPin" inputmode="numeric" maxlength="6" placeholder="예: 004286" style="flex:1"><button class="btn p s" id="nMake">만들기</button></div>
  <div id="nOut"></div>` : ''}
  </div>`);
  $('#sx').onclick = closeSheet;
  if ($('#nMake')) $('#nMake').onclick = async () => {
    const pin = $('#nPin').value.replace(/\D/g, ''), out = $('#nOut');
    if (pin.length !== 6) { out.innerHTML = '<div class="hint" style="color:var(--exp)">숫자 6자리를 넣어주세요</div>'; return; }
    if (pin === DEMO_PIN) { out.innerHTML = '<div class="hint" style="color:var(--exp)">000000은 구경 모드용이라 쓸 수 없어요</div>'; return; }
    const em = await pinEmail(pin);
    out.innerHTML = `<div class="scat" style="margin-top:8px;font-size:13px;line-height:1.8">Supabase → Authentication → Users → Add user → Create new user<br>
      <b>Email</b> <span style="word-break:break-all">${em}</span> <button class="btn g s" id="nCopy" style="padding:4px 8px">복사</button><br>
      <b>Password</b> ${pin}<br><b>Auto Confirm User</b> ✅ 체크</div>`;
    $('#nCopy').onclick = () => navigator.clipboard.writeText(em).then(() => toast('이메일을 복사했어요'), () => toast('길게 눌러 직접 복사해 주세요'));
  };
  $('#sAddCat').onclick = () => { collectSettings(); S.settings.cats.expense.push({ name: '새 분류', icon: '•', budget: 0, subs: '' }); openSettings(); };
  $('#sSave').onclick = async () => { collectSettings(); try { await Store.saveSettings(); closeSheet(); render(); toast('설정을 저장했어요'); } catch(err) { toast('저장 실패: ' + err.message); } };
  $('#sOut').onclick = () => Store.logout();
}
function collectSettings(){
  const st = S.settings;
  st.name = $('#sName').value.trim();
  st.allowance = num($('#sAllow').value) || 100000; st.weekStart = Number($('#sWs').value);
  document.querySelectorAll('[data-se]').forEach(x => { const c = st.cats.expense[x.dataset.i], k = x.dataset.se; c[k] = k === 'budget' ? num(x.value) : x.value.trim(); });
  document.querySelectorAll('[data-si]').forEach(x => { st.cats.income[x.dataset.i][x.dataset.si] = x.value.trim(); });
  st.cats.expense = st.cats.expense.filter(c => c.name);
}

/* ============ 백업 ============ */
function openBackup(){
  openSheet(`<h2>⬇ 백업<button id="bx">✕</button></h2>
  <div class="hint" style="margin-bottom:12px">전체 내역 ${fmt(S.txs.length)}건을 내려받아요. 엑셀은 열어보기용, 백업 파일(.json)은 복원용이에요.</div>
  <button class="btn p" id="bXlsx">📊 엑셀(.xlsx)</button><div style="height:8px"></div><button class="btn g" id="bJson">🗂 백업 파일(.json)</button>`);
  $('#bx').onclick = closeSheet;
  $('#bJson').onclick = () => download(new Blob([JSON.stringify({ version: VERSION, exported: new Date().toISOString(), settings: S.settings, txs: S.txs }, null, 1)], {type:'application/json'}), 'SEOKWALLET_backup_' + ds(today()) + '.json');
  $('#bXlsx').onclick = async () => {
    try {
      if (!window.XLSX) await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
      const rows = [['날짜','구분','분류','세부항목','결제금액','받은 더치','내 지출','용돈차감','받을 돈','잡이익(초과)','메모','더치 상세']];
      S.txs.slice().sort((a,b) => a.date.localeCompare(b.date)).forEach(t => { const c = calc(t); rows.push([t.date, t.type === 'expense' ? '지출' : '수입', t.cat, t.sub, t.amount, c.recv, t.type === 'expense' ? c.net : '', t.allow ? 'Y' : '', c.pending || '', c.extra || '', t.memo, (t.dutch || []).map(p => `${p.name}:${p.recv}/${p.share}`).join(', ')]); });
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '내역');
      XLSX.writeFile(wb, 'SEOKWALLET_' + ds(today()) + '.xlsx');
    } catch(err) { toast('엑셀 만들기 실패'); }
  };
}
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ============ 시작 ============ */
/* ============ PIN 잠금 화면 ============ */
let PIN = '', PIN_BUSY = false;
function showLock(msg){
  PIN = '';
  $('#root').innerHTML = `<div class="lock"><div class="lk-logo">💸</div><h1>SEOK WALLET</h1><div class="lk-sub">비밀번호 6자리를 입력하세요</div>
    <div class="lk-dots" id="lkDots">${'<i></i>'.repeat(6)}</div><div class="lk-msg" id="lkMsg">${esc(msg || '')}</div>
    <div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}<button data-k="demo" class="lk-s">구경하기</button><button data-k="0">0</button><button data-k="del" class="lk-s">⌫</button></div>
    <div class="lk-foot">${VERSION} | SEOK WALLET</div></div>`;
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => pinKey(b.dataset.k));
}
function pinDots(){ document.querySelectorAll('#lkDots i').forEach((d, i) => d.classList.toggle('on', i < PIN.length)); }
async function pinKey(k){
  if (PIN_BUSY) return;
  if (k === 'del') { PIN = PIN.slice(0, -1); pinDots(); return; }
  if (k === 'demo') { PIN = DEMO_PIN; pinDots(); }
  else { if (PIN.length >= 6) return; PIN += k; pinDots(); $('#lkMsg').textContent = ''; }
  if (PIN.length < 6) return;
  PIN_BUSY = true; $('#lkMsg').textContent = '확인 중…';
  try {
    const ok = await Store.unlock(PIN);
    if (ok) { PIN_BUSY = false; boot2(); return; }
    $('#lkMsg').textContent = '비밀번호가 틀렸어요';
  } catch(err) { $('#lkMsg').textContent = '연결 오류: ' + err.message; }
  const dots = $('#lkDots'); dots.classList.add('shake'); setTimeout(() => dots.classList.remove('shake'), 400);
  PIN = ''; pinDots(); PIN_BUSY = false;
}
document.addEventListener('keydown', e => { if (!$('#lkDots')) return; if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); });
function boot2(){ const T = today(); S.view = 'home'; S.mon = new Date(T.getFullYear(), T.getMonth(), 1); S.wk = T; S.cal = new Date(T.getFullYear(), T.getMonth(), 1); S.sel = ds(T); history.replaceState(snap(), '', '#home'); render(); scrollTo(0,0); }
showLock();
</script>
